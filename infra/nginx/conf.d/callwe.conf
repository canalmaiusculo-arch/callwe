# =========================================================
# CallWe — Nginx reverse proxy
# Domínios:
#   app.callwe.app      → Next.js (web)
#   api.callwe.app      → NestJS (api)  [inclui /realtime WebSocket]
# SSL via Let's Encrypt (certbot mountado em /etc/letsencrypt).
# =========================================================

# Redirect HTTP → HTTPS (exceto ACME challenge do certbot)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------- WEB (Next.js) ---------
server {
    listen 443 ssl http2;
    server_name app.callwe.app;

    ssl_certificate     /etc/letsencrypt/live/app.callwe.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.callwe.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 20m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --------- API (NestJS) + WebSocket ---------
server {
    listen 443 ssl http2;
    server_name api.callwe.app;

    ssl_certificate     /etc/letsencrypt/live/api.callwe.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.callwe.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # WebSocket (socket.io) — Upgrade headers obrigatórios
    location /realtime/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Webhooks (CloudTalk / Meta) — precisam de rawBody para validar assinatura
    location ~ ^/api/webhooks/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
